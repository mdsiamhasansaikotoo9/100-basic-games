<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit Swap</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;font-family:'Orbitron',system-ui,sans-serif;color:#fff;text-align:center}
  #hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;
    font-family:'Orbitron',system-ui,sans-serif;color:#cfe8ff;font-size:14px;letter-spacing:2px;pointer-events:none}
  #score{font-size:28px;color:#fff;text-shadow:0 0 12px #3df5ff}
  h1{font-size:clamp(34px,9vw,64px);margin:0;letter-spacing:4px;
    background:linear-gradient(90deg,#3df5ff,#ff3df0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(61,245,255,.5))}
  .sub{opacity:.8;margin-top:14px;font-size:13px;letter-spacing:2px;line-height:1.9}
  .tap{margin-top:28px;font-size:15px;letter-spacing:3px;color:#ffe35a;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div>BEST <span id="best">0</span></div><div id="score">0</div><div id="combo">x1</div></div>
<div id="ui">
  <h1 id="title">ORBIT SWAP</h1>
  <div class="sub" id="sub">TAP / SPACE to swap rings<br>Grab the <span style="color:#ffe35a">gold</span> · dodge the <span style="color:#ff4d6d">red</span></div>
  <div class="tap" id="tap">TAP TO START</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,cx,cy,R1,R2,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2+10;const m=Math.min(W,H);R1=m*0.2;R2=m*0.36;}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('orbitBest')||0}catch(e){}
$('best').textContent=best;

// sound
let ac=null;
function beep(f,d=0.08,type='sine',v=0.12){try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

const stars=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+0.2,t:Math.random()*6}));
let state='menu',p,ents,parts,score,combo,t,spawnT,speed,shake,flash;

function reset(){p={a:-Math.PI/2,ring:1,r:R2,dir:1};ents=[];parts=[];score=0;combo=1;t=0;spawnT=0.6;speed=1.6;shake=0;flash=0;}
reset();

function swap(){
  if(state==='menu'||state==='over'){
    if(state==='over'&&t<0.6)return;
    reset();state='play';$('ui').classList.add('hidden');beep(440,.1,'triangle');return;}
  p.ring=1-p.ring;beep(p.ring?330:520,.06,'square',.05);
  burst(pos(p.a,p.r),'#3df5ff',6,90);
}
addEventListener('pointerdown',e=>{e.preventDefault();swap();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();swap();}});

const pos=(a,r)=>({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
function burst(o,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp;
  parts.push({x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col});}}

function spawn(){
  const ring=Math.random()<0.5?0:1;
  const a=p.a+Math.PI+(Math.random()-0.5)*1.6; // spawn across the circle: fair
  const gold=Math.random()<0.38;
  const drift=(Math.random()<0.5?-1:1)*(0.2+Math.random()*0.5)*(gold?0.5:1);
  ents.push({ring,a,drift,gold,born:0});
}

function update(dt){
  t+=dt;
  for(const s of stars){s.t+=dt;}
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.94;q.vy*=0.94;q.life-=dt*1.6;}
  parts=parts.filter(q=>q.life>0);
  shake*=0.88;flash*=0.9;
  if(state!=='play')return;
  speed=1.6+Math.min(t*0.035,1.6);
  p.a+=speed*dt*p.dir;
  const tr=p.ring?R2:R1;p.r+=(tr-p.r)*Math.min(1,dt*18);
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.35,1.0-t*0.012)*(0.7+Math.random()*0.6);}
  const pp=pos(p.a,p.r);
  for(const e of ents){
    e.born+=dt;e.a+=e.drift*dt;
    const r=e.ring?R2:R1,ep=pos(e.a,r);
    const d=Math.hypot(ep.x-pp.x,ep.y-pp.y);
    if(e.born>0.4&&d<(e.gold?20:18)){
      if(e.gold){e.dead=1;score+=combo;combo=Math.min(combo+1,9);burst(ep,'#ffe35a',18,180);beep(660+combo*60,.09,'triangle');}
      else{die(pp);return;}
    }
    if(e.born>9)e.dead=1;
  }
  ents=ents.filter(e=>!e.dead);
  if(Math.floor(t*2)!==Math.floor((t-dt)*2)&&t>0.5){} // reserved
  $('score').textContent=score;$('combo').textContent='x'+combo;
}

function die(pp){
  state='over';t=0;shake=18;flash=1;burst(pp,'#ff4d6d',40,260);burst(pp,'#3df5ff',20,160);
  beep(120,.4,'sawtooth',.15);
  if(score>best){best=score;try{localStorage.setItem('orbitBest',best)}catch(e){}}
  $('best').textContent=best;
  $('title').textContent='GAME OVER';
  $('sub').innerHTML='Score <b style="color:#ffe35a">'+score+'</b> · Best '+best;
  $('tap').textContent='TAP TO RETRY';
  setTimeout(()=>{if(state==='over')$('ui').classList.remove('hidden')},500);
}

function glowCircle(x,y,r,col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.shadowBlur=0;}

function draw(){
  ctx.fillStyle='#05030f';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  for(const s of stars){ctx.globalAlpha=0.35+0.35*Math.sin(s.t*1.5);ctx.fillStyle='#bcd4ff';
    ctx.fillRect(s.x*W,s.y*H,s.s,s.s);}
  ctx.globalAlpha=1;
  // core
  const pulse=1+Math.sin(performance.now()/400)*0.05;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R1*0.55*pulse);
  g.addColorStop(0,'#ff3df0');g.addColorStop(0.6,'#6a1bff');g.addColorStop(1,'rgba(40,0,90,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R1*0.55*pulse,0,6.283);ctx.fill();
  // rings
  for(const [r,on] of [[R1,p.ring===0],[R2,p.ring===1]]){
    ctx.strokeStyle=on?'rgba(61,245,255,.55)':'rgba(140,120,255,.18)';ctx.lineWidth=on?2.5:1.5;
    ctx.shadowColor='#3df5ff';ctx.shadowBlur=on?14:0;ctx.setLineDash(on?[]:[6,8]);
    ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke();}
  ctx.setLineDash([]);ctx.shadowBlur=0;
  // entities
  const now=performance.now()/1000;
  for(const e of ents){
    const ep=pos(e.a,e.ring?R2:R1),fade=Math.min(1,e.born/0.4);ctx.globalAlpha=fade;
    if(e.gold){glowCircle(ep.x,ep.y,7+Math.sin(now*6)*1.5,'#ffe35a',20);}
    else{ctx.save();ctx.translate(ep.x,ep.y);ctx.rotate(now*4);ctx.shadowColor='#ff4d6d';ctx.shadowBlur=18;
      ctx.fillStyle='#ff4d6d';ctx.beginPath();
      for(let i=0;i<10;i++){const rr=i%2?5:12,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      ctx.closePath();ctx.fill();ctx.restore();}
  }
  ctx.globalAlpha=1;
  // player + trail
  if(state!=='over'){
    for(let i=12;i>0;i--){const tp=pos(p.a-i*0.035*p.dir,p.r);ctx.globalAlpha=(12-i)/30;
      glowCircle(tp.x,tp.y,9-i*0.5,'#3df5ff',0);}
    ctx.globalAlpha=1;const pp=pos(p.a,p.r);glowCircle(pp.x,pp.y,10,'#3df5ff',24);glowCircle(pp.x,pp.y,4,'#fff',0);
  }
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,4,4);}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0.02){ctx.fillStyle='rgba(255,77,109,'+flash*0.35+')';ctx.fillRect(0,0,W,H);}
}

let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='menu')p.a+=dt*1.2;
  update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
