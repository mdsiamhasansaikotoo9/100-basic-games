<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shell Game</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Level <b id="s">1</b></span><span id="l">❤️❤️❤️</span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x;
let cups = [], ballCup = 0, level = 1, lives = 3, state = 'idle', swaps = [], cur = null, lift = 0, picked = -1, msg = '', ncup = 3;
G.set('b', G.best('shell'));
const slotX = i => K.W / 2 + (i - (ncup - 1) / 2) * Math.min(K.W / ncup, 130), CY = () => K.H * .55;
function setup() {
  ncup = level >= 6 ? 4 : 3; cups = [...Array(ncup)].map((_, i) => ({ slot: i, x: slotX(i), y: 0 })); ballCup = Math.random() * ncup | 0; picked = -1;
  state = 'show'; lift = 1; msg = 'Watch the ball…'; G.set('s', level);
  setTimeout(() => { state = 'lower'; }, 1200);
  setTimeout(() => { state = 'shuffle'; msg = ''; const n = 4 + level * 2; swaps = []; for (let i = 0; i < n; i++) { const a = Math.random() * ncup | 0; let b; do { b = Math.random() * ncup | 0 } while (b === a); swaps.push([a, b]) } next() }, 1700);
}
function next() {
  if (!swaps.length) { state = 'pick'; msg = 'Which cup has the ball?'; return }
  const [a, b] = swaps.shift(), ca = cups.find(c => c.slot === a), cb = cups.find(c => c.slot === b);
  cur = { ca, cb, t: 0, dur: Math.max(.16, .5 - level * .03), a, b }; G.beep(300 + Math.random() * 100, .04, 'triangle', .04);
}
function start() { level = 1; lives = 3; G.set('l', '❤️❤️❤️'); setup() }
addEventListener('pointerdown', e => {
  if (state !== 'pick') return;
  const c = cups.find(c => Math.abs(e.clientX - c.x) < 50 && Math.abs(e.clientY - CY()) < 80); if (!c) return;
  picked = cups.indexOf(c); state = 'reveal'; lift = 0;
  const ok = picked === ballCup;
  msg = ok ? 'You found it! ✓' : 'Not there ✗'; G.beep(ok ? 900 : 150, .25, ok ? 'triangle' : 'sawtooth');
  setTimeout(() => {
    if (ok) { G.set('b', G.best('shell', level)); level++; setup() }
    else { lives--; G.set('l', '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives))); if (lives <= 0) { state = 'idle'; G.overlay('Game Over', 'You reached level ' + level + '.', 'Play again', start) } else setup() }
  }, 1400);
});
G.loop(dt => {
  if (state === 'show' || state === 'reveal') lift = Math.min(1, lift + dt * 4); if (state === 'lower') lift = Math.max(0, lift - dt * 4);
  if (cur) {
    cur.t += dt; const p = Math.min(1, cur.t / cur.dur), e = p * p * (3 - 2 * p);
    cur.ca.x = slotX(cur.a) + (slotX(cur.b) - slotX(cur.a)) * e; cur.cb.x = slotX(cur.b) + (slotX(cur.a) - slotX(cur.b)) * e;
    cur.ca.y = -Math.sin(p * Math.PI) * 30; cur.cb.y = Math.sin(p * Math.PI) * 30;
    if (p >= 1) { cur.ca.slot = cur.b; cur.cb.slot = cur.a; cur.ca.y = cur.cb.y = 0; cur = null; next() }
  }
  x.fillStyle = '#2a1608'; x.fillRect(0, 0, K.W, K.H);
  x.fillStyle = '#0f5a36'; x.fillRect(0, CY() - 20, K.W, 140);
  const cy = CY();
  cups.forEach((c, i) => {
    const up = (state === 'show' && i === ballCup) || (state === 'reveal' && (i === picked || i === ballCup)) ? lift * 70 : (state === 'lower' && i === ballCup ? lift * 70 : 0);
    if (i === ballCup && up > 5) { x.fillStyle = '#ffe35a'; x.shadowColor = '#ffe35a'; x.shadowBlur = 16; x.beginPath(); x.arc(c.x, cy + 40, 14, 0, 7); x.fill(); x.shadowBlur = 0 }
    const top = cy - 30 - up + c.y;
    x.fillStyle = '#c0392b'; x.beginPath(); x.moveTo(c.x - 30, top); x.lineTo(c.x + 30, top); x.lineTo(c.x + 44, top + 84); x.lineTo(c.x - 44, top + 84); x.closePath(); x.fill();
    x.fillStyle = '#e74c3c'; x.fillRect(c.x - 44, top + 76, 88, 10); x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(c.x - 22, top + 8, 8, 60);
  });
  x.fillStyle = '#ffe35a'; x.font = '800 22px system-ui'; x.textAlign = 'center'; x.fillText(msg, K.W / 2, K.H * .3);
});
G.overlay('Shell Game', 'Watch which cup hides the ball.<br>Follow it while the cups shuffle, then tap the right cup.<br>It gets faster each level!', 'Start', start);
</script></body></html>
