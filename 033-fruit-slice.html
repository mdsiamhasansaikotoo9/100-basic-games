<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Slice</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span id="l">❤️❤️❤️</span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x, FR = ['🍉', '🍍', '🍊', '🍎', '🥭', '🍋', '🍑', '🥥'];
let items = [], halves = [], trail = [], down = false, score = 0, lives = 3, run = false, t = 0, wave = 0, splats = [], combo = { n: 0, t: 0 };
G.set('b', G.best('slice'));
function start() { items = []; halves = []; splats = []; score = 0; lives = 3; t = 0; wave = 1; run = true; G.set('s', 0); G.set('l', '❤️❤️❤️') }
function toss() {
  const n = 1 + (Math.random() * Math.min(4, 1 + t / 15) | 0);
  for (let i = 0; i < n; i++) {
    const bomb = Math.random() < Math.min(.25, .06 + t * .004), x0 = K.W * (.15 + Math.random() * .7);
    items.push({ x: x0, y: K.H + 40, vx: (K.W / 2 - x0) * (.3 + Math.random() * .5), vy: -K.H * (1.05 + Math.random() * .3), e: bomb ? '💣' : FR[Math.random() * FR.length | 0], bomb, r: 30, rot: 0, vr: (Math.random() - .5) * 6 });
  }
}
const segHit = (ax, ay, bx, by, cx, cy, r) => { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy || 1, k = Math.max(0, Math.min(1, ((cx - ax) * dx + (cy - ay) * dy) / l)); return Math.hypot(ax + dx * k - cx, ay + dy * k - cy) < r };
function lose() { lives--; G.set('l', '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives))); G.beep(150, .25, 'sawtooth'); if (lives <= 0) end('Out of hearts') }
function end(msg) { run = false; G.set('b', G.best('slice', score)); setTimeout(() => G.overlay(msg, 'Score: ' + score, 'Play again', start), 500) }
addEventListener('pointerdown', e => { down = true; trail = [{ x: e.clientX, y: e.clientY, life: 1 }] });
addEventListener('pointerup', () => down = false);
addEventListener('pointermove', e => {
  if (!down) return; const p = { x: e.clientX, y: e.clientY, life: 1 }, q = trail[trail.length - 1] || p; trail.push(p);
  if (!run) return;
  for (const it of items) {
    if (it.dead || !segHit(q.x, q.y, p.x, p.y, it.x, it.y, it.r)) continue;
    it.dead = 1;
    if (it.bomb) { G.beep(80, .6, 'sawtooth', .2); splats.push({ x: it.x, y: it.y, c: '#fff', life: 1, big: 1 }); end('Boom! 💥'); return }
    score++; combo.n++; combo.t = .25; G.set('s', score); G.beep(500 + Math.random() * 400, .06, 'triangle');
    const ang = Math.atan2(p.y - q.y, p.x - q.x) + Math.PI / 2;
    for (const s of [-1, 1]) halves.push({ x: it.x, y: it.y, vx: it.vx * .5 + Math.cos(ang) * s * 120, vy: it.vy * .3, e: it.e, side: s, rot: it.rot, vr: s * 4, life: 1.5 });
    splats.push({ x: it.x, y: it.y, c: `hsl(${Math.random() * 60},100%,60%)`, life: 1 });
  }
});
G.loop(dt => {
  for (const p of trail) p.life -= dt * 5; trail = trail.filter(p => p.life > 0);
  for (const s of splats) s.life -= dt * 1.2; splats = splats.filter(s => s.life > 0);
  const g = K.H * 1.3;
  for (const h of halves) { h.vy += g * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt; h.life -= dt } halves = halves.filter(h => h.life > 0);
  if (combo.t > 0) { combo.t -= dt; if (combo.t <= 0) { if (combo.n >= 3) { score += combo.n; G.set('s', score); splats.push({ x: K.W / 2, y: K.H * .3, txt: 'COMBO +' + combo.n, life: 1.2 }); G.beep(1200, .2, 'triangle') } combo.n = 0 } }
  if (run) {
    t += dt; wave -= dt; if (wave <= 0) { toss(); wave = Math.max(.8, 2 - t * .02) }
    for (const it of items) {
      it.vy += g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
      if (!it.dead && it.vy > 0 && it.y > K.H + 50) { it.dead = 1; if (!it.bomb) { lose(); if (!run) break } }
    }
    items = items.filter(i => !i.dead);
  }
  const bg = x.createLinearGradient(0, 0, 0, K.H); bg.addColorStop(0, '#2a1608'); bg.addColorStop(1, '#120a04'); x.fillStyle = bg; x.fillRect(0, 0, K.W, K.H);
  for (const s of splats) { x.globalAlpha = s.life * .6; if (s.txt) { x.globalAlpha = s.life; x.fillStyle = '#ffe35a'; x.font = '900 30px system-ui'; x.textAlign = 'center'; x.fillText(s.txt, s.x, s.y) } else { x.fillStyle = s.c; x.beginPath(); x.arc(s.x, s.y, s.big ? 200 * (1 - s.life) + 30 : 40, 0, 7); x.fill() } }
  x.globalAlpha = 1; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '60px system-ui';
  for (const it of items) { x.save(); x.translate(it.x, it.y); x.rotate(it.rot); x.fillText(it.e, 0, 0); x.restore() }
  for (const h of halves) { x.save(); x.globalAlpha = Math.min(1, h.life); x.translate(h.x, h.y); x.rotate(h.rot); x.beginPath(); x.rect(h.side < 0 ? -40 : 0, -40, 40, 80); x.clip(); x.fillText(h.e, 0, 0); x.restore() }
  if (trail.length > 1) {
    x.lineCap = 'round'; x.shadowColor = '#3df5ff'; x.shadowBlur = 14;
    for (let i = 1; i < trail.length; i++) { x.strokeStyle = `rgba(220,250,255,${trail[i].life})`; x.lineWidth = 2 + trail[i].life * 6; x.beginPath(); x.moveTo(trail[i - 1].x, trail[i - 1].y); x.lineTo(trail[i].x, trail[i].y); x.stroke() }
    x.shadowBlur = 0;
  }
});
G.overlay('Fruit Slice', 'Swipe across the fruit to slice it.<br>Slice 3 or more in one swipe for a combo bonus.<br>Never slice a 💣 bomb! Dropped fruit costs a heart.', 'Start', start);
</script></body></html>
