<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Guess the Number</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#box{position:fixed;inset:56px 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 12px}
#info{color:#cfe8ff;font-weight:700;text-align:center}
#range{width:min(92vw,420px);height:26px;border-radius:13px;background:#1d1550;position:relative;overflow:hidden}
#win{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#3df5ff,#ff3df0);transition:left .3s,width .3s}
#rl{width:min(92vw,420px);display:flex;justify-content:space-between;font-weight:800;color:#ffe35a}
#entry{font-size:clamp(40px,12vw,60px);font-weight:900;min-height:1.2em;letter-spacing:3px}
#hint{font-size:20px;font-weight:900;min-height:26px}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,320px)}
#pad button{font:inherit;font-weight:900;font-size:24px;padding:12px 0;border:0;border-radius:12px;background:#2f2080;color:#fff}
#pad button.go{background:#4dff88;color:#0b0820}
</style></head><body>
<div class="hud"><span>Wins <b id="s">0</b></span><span>Guesses left <b id="g">7</b></span><span>Best <b id="b">0</b></span></div>
<div id="box"><div id="info"></div><div id="rl"><span id="lo">1</span><span id="hi">100</span></div><div id="range"><div id="win"></div></div><div id="hint"></div><div id="entry"></div>
<div id="pad"></div></div>
<script>
let secret, lo, hi, max, left, entry = '', streak = 0, busy = false;
G.set('b', G.best('guessnum'));
const pad = document.getElementById('pad');
['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'].forEach(k => { const b = document.createElement('button'); b.textContent = k; if (k === '✓') b.className = 'go'; b.onclick = () => key(k); pad.appendChild(b) });
addEventListener('keydown', e => { if (/^\d$/.test(e.key)) key(e.key); if (e.key === 'Backspace') key('⌫'); if (e.key === 'Enter') key('✓') });
function round() {
  max = streak < 3 ? 100 : streak < 6 ? 500 : 1000; left = max === 100 ? 7 : max === 500 ? 9 : 10;
  secret = 1 + (Math.random() * max | 0); lo = 1; hi = max; entry = ''; busy = false; render(); G.set('hint', ''); G.set('info', `I'm thinking of a number from 1 to ${max}. You have ${left} guesses.`);
}
function render() {
  G.set('entry', entry || '—'); G.set('g', left); G.set('lo', lo); G.set('hi', hi);
  const w = document.getElementById('win'); w.style.left = (lo - 1) / max * 100 + '%'; w.style.width = Math.max(1, (hi - lo + 1) / max * 100) + '%';
}
function key(k) {
  if (busy) return;
  if (k === '⌫') entry = entry.slice(0, -1); else if (k !== '✓') { if (entry.length < String(max).length) entry += k; entry = String(+entry || '') }
  else {
    const g = +entry; const h = document.getElementById('hint');
    if (!g || g < lo || g > hi) { h.textContent = 'Pick a number between ' + lo + ' and ' + hi; h.style.color = '#ffe35a'; return }
    left--; entry = '';
    if (g === secret) { busy = true; streak++; G.set('s', streak); G.set('b', G.best('guessnum', streak)); h.textContent = '🎉 Yes! It was ' + secret; h.style.color = '#4dff88'; lo = hi = g; render(); G.beep(1000, .3, 'triangle'); return setTimeout(round, 1400) }
    if (g < secret) { lo = g + 1; h.textContent = g + ' is too LOW ⬆'; h.style.color = '#3df5ff'; G.beep(500, .08, 'triangle') }
    else { hi = g - 1; h.textContent = g + ' is too HIGH ⬇'; h.style.color = '#ff3df0'; G.beep(350, .08, 'triangle') }
    if (left <= 0) { busy = true; render(); G.beep(150, .4, 'sawtooth'); return setTimeout(() => G.overlay('Out of guesses', 'The number was ' + secret + '.<br>Win streak: ' + streak + '<br>Tip: always guess the middle of the bar!', 'Play again', () => { streak = 0; G.set('s', 0); round() }), 700) }
  }
  render();
}
round();
G.overlay('Guess the Number', 'I pick a secret number. Type a guess and tap ✓.<br>I\'ll tell you if it\'s too high or too low.<br>Find it before you run out of guesses. Win 3 in a row and it gets bigger!', 'Start', () => {});
</script></body></html>
