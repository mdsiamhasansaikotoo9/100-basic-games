<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Number Drop</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x, C = 5, R = 7;
let B, next, after, score = 0, run = false, busy = false, cell, ox, oy, pops = [], hi = 2;
G.set('b', G.best('numberdrop'));
K.onresize = () => { cell = Math.floor(Math.min((K.W - 20) / C, (K.H - 230) / R)); ox = (K.W - cell * C) / 2; oy = 140 }; K.onresize();
const col = v => `hsl(${(Math.log2(v) * 37 + 180) % 360},85%,${Math.max(45, 70 - Math.log2(v) * 2)}%)`;
const rnd = () => { const top = Math.max(2, Math.min(6, Math.log2(hi) - 2)); return 2 ** (1 + (Math.random() * top | 0)) };
function start() { B = [...Array(R)].map(() => Array(C).fill(0)); score = 0; hi = 2; next = rnd(); after = rnd(); run = true; busy = false; G.set('s', 0) }
const wait = ms => new Promise(r => setTimeout(r, ms));
function gravity() { for (let c = 0; c < C; c++) { const vals = []; for (let r = 0; r < R; r++) if (B[r][c]) vals.push(B[r][c]); for (let r = 0; r < R; r++) B[r][c] = r < vals.length ? vals[r] : 0 } }
// row 0 = bottom
async function drop(c) {
  if (!run || busy) return; let r = 0; while (r < R && B[r][c]) r++;
  if (r >= R) { if (B[R - 1][c] !== next) return; r = R - 1; B[r][c] *= 2; score += B[r][c]; G.set('s', score) } else B[r][c] = next;
  busy = true; G.beep(400, .05, 'triangle'); next = after; after = rnd();
  let focus = [[r, c]];
  for (let guard = 0; guard < 30; guard++) {
    let merged = false;
    for (const [fr, fc] of focus) {
      const v = B[fr] && B[fr][fc]; if (!v) continue;
      const nb = [[fr - 1, fc], [fr, fc - 1], [fr, fc + 1], [fr + 1, fc]].filter(([a, b]) => a >= 0 && a < R && b >= 0 && b < C && B[a][b] === v);
      if (nb.length) {
        nb.forEach(([a, b]) => { pops.push({ r: a, c: b, life: 1 }); B[a][b] = 0 }); B[fr][fc] = v * 2 ** nb.length; score += B[fr][fc]; hi = Math.max(hi, B[fr][fc]); G.set('s', score);
        G.beep(500 + Math.log2(B[fr][fc]) * 60, .1, 'triangle'); merged = true; await wait(170); gravity(); await wait(120);
        focus = []; for (let a = 0; a < R; a++) for (let b = 0; b < C; b++) if (B[a][b]) focus.push([a, b]); break;
      }
    }
    if (!merged) break;
  }
  busy = false;
  const full = [...Array(C).keys()].every(k => B[R - 1][k] && B[R - 1][k] !== next);
  if (full) { run = false; G.beep(110, .5, 'sawtooth'); G.set('b', G.best('numberdrop', score)); G.overlay('Board full!', 'Score: ' + score + '<br>Biggest block: ' + hi, 'Play again', start) }
}
addEventListener('pointerdown', e => { const c = Math.floor((e.clientX - ox) / cell); if (c >= 0 && c < C && e.clientY > oy - 60) drop(c) });
addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '5') drop(+e.key - 1) });
function tile(px, py, v, s = 1) { const w = cell * .9 * s; x.fillStyle = col(v); x.shadowColor = col(v); x.shadowBlur = 10; x.beginPath(); x.roundRect ? x.roundRect(px - w / 2, py - w / 2, w, w, 10) : x.rect(px - w / 2, py - w / 2, w, w); x.fill(); x.shadowBlur = 0; x.fillStyle = '#0b0820'; const txt = v >= 1e6 ? (v / 1e6 | 0) + 'M' : v >= 1e4 ? (v / 1e3 | 0) + 'K' : v; x.font = `900 ${w * (String(txt).length > 3 ? .3 : .4)}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, px, py + 1) }
G.loop(dt => {
  for (const p of pops) p.life -= dt * 4; pops = pops.filter(p => p.life > 0);
  x.fillStyle = '#0b0820'; x.fillRect(0, 0, K.W, K.H); if (!B) return;
  for (let c = 0; c < C; c++) { x.fillStyle = c % 2 ? '#150e34' : '#1a123e'; x.fillRect(ox + c * cell, oy, cell, cell * R) }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (B[r][c]) tile(ox + (c + .5) * cell, oy + (R - 1 - r + .5) * cell, B[r][c]);
  for (const p of pops) { x.globalAlpha = p.life; x.strokeStyle = '#fff'; x.lineWidth = 3; x.strokeRect(ox + p.c * cell + 4, oy + (R - 1 - p.r) * cell + 4, cell - 8, cell - 8) } x.globalAlpha = 1;
  if (run) { tile(K.W / 2, 92, next, .8); x.globalAlpha = .5; tile(K.W / 2 + cell, 92, after, .5); x.globalAlpha = 1; x.fillStyle = '#cfe8ff'; x.font = '700 12px system-ui'; x.fillText('next', K.W / 2, 56) }
});
G.overlay('Number Drop', 'Tap a column to drop the next block.<br>Blocks that touch the same number merge and double!<br>Chain merges for big scores. Don\'t fill the board.', 'Start', start);
</script></body></html>
