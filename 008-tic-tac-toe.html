<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tic-Tac-Toe</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,60vh,400px);aspect-ratio:1;display:grid;
  grid-template-columns:repeat(3,1fr);gap:8px}
.q{background:#1d1050;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,16vw,90px);
  font-weight:800;cursor:pointer}
.q.X{color:#3df5ff;text-shadow:0 0 18px #3df5ff}.q.O{color:#ff3df0;text-shadow:0 0 18px #ff3df0}
.q.win{background:#2f2080}
#msg{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-weight:700;letter-spacing:1px;color:#cfe8ff}
#lvl{position:fixed;right:12px;bottom:12px;z-index:20;font:inherit;font-weight:700;font-size:14px;color:#0b0820;
  background:#ffe35a;border:0;border-radius:999px;padding:8px 14px}
</style></head><body>
<div class="hud"><span>You <b id="w">0</b></span><span>Draw <b id="d">0</b></span><span>CPU <b id="l">0</b></span></div>
<div id="g"></div><div id="msg"></div><button id="lvl">Normal</button>
<script>
const g = document.getElementById('g'), sq = [], W = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let B, busy, youFirst = true, hard = false, st = { w: 0, d: 0, l: 0 };
for (let i = 0; i < 9; i++) { const q = document.createElement('div'); q.className = 'q'; q.onclick = () => play(i); g.appendChild(q); sq.push(q) }
document.getElementById('lvl').onclick = e => { hard = !hard; e.target.textContent = hard ? 'Hard' : 'Normal' };
const winner = b => { for (const l of W) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l; return null };
function mm(b, me) { // minimax: returns score for O
  const w = winner(b); if (w) return b[w[0]] === 'O' ? 10 : -10; if (b.every(Boolean)) return 0;
  let best = me ? -99 : 99;
  for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = me ? 'O' : 'X'; const s = mm(b, !me); b[i] = null; best = me ? Math.max(best, s) : Math.min(best, s) }
  return best;
}
function cpu() {
  const free = B.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  let pick;
  if (!hard && Math.random() < .3) pick = free[Math.random() * free.length | 0];
  else { let bs = -99; for (const i of free) { B[i] = 'O'; const s = mm(B, false); B[i] = null; if (s > bs) { bs = s; pick = i } } }
  put(pick, 'O');
}
function render() { B.forEach((v, i) => { sq[i].textContent = v || ''; sq[i].className = 'q ' + (v || '') }) }
function put(i, p) { B[i] = p; render(); G.beep(p == 'X' ? 520 : 330, .07, 'triangle'); check() }
function check() {
  const w = winner(B);
  if (w || B.every(Boolean)) {
    busy = true; let m;
    if (w) { w.forEach(i => sq[i].classList.add('win')); if (B[w[0]] == 'X') { st.w++; m = 'You win! 🎉' } else { st.l++; m = 'CPU wins' } }
    else { st.d++; m = "It's a draw" }
    G.set('w', st.w); G.set('d', st.d); G.set('l', st.l); G.set('msg', m + ' — tap to play again');
    G.beep(w && B[w[0]] == 'X' ? 880 : 200, .25, 'triangle');
    setTimeout(() => { busy = 'done' }, 300);
    return true;
  }
  return false;
}
function play(i) {
  if (busy === 'done') return newGame();
  if (busy || B[i]) return;
  put(i, 'X'); if (winner(B) || B.every(Boolean)) return;
  busy = true; G.set('msg', 'CPU is thinking…');
  setTimeout(() => { cpu(); if (!winner(B) && !B.every(Boolean)) { busy = false; G.set('msg', 'Your turn (X)') } }, 400);
}
function newGame() {
  B = Array(9).fill(null); busy = false; render(); youFirst = !youFirst;
  if (youFirst) G.set('msg', 'Your turn (X)');
  else { busy = true; G.set('msg', 'CPU goes first…'); setTimeout(() => { cpu(); busy = false; G.set('msg', 'Your turn (X)') }, 500) }
}
youFirst = false; newGame();
G.overlay('Tic-Tac-Toe', 'Get 3 in a row before the CPU.<br>You are X. Turns swap each game.<br>Tap the yellow button for Hard mode.', 'Start', () => {});
</script></body></html>
