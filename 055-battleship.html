<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battleship</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
.bd{position:fixed;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#0a2a5a;padding:3px;border-radius:8px}
#en{top:58px;width:min(92vw,48vh,400px);aspect-ratio:1}
#me{bottom:56px;width:min(46vw,24vh,200px);aspect-ratio:1}
.s{background:#123a7a;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3vw,18px);cursor:pointer}
.s.ship{background:#6a7a9a}.s.miss::after{content:'•';color:#9ab}.s.hit{background:#ff4d6d}.s.hit::after{content:'✕';color:#fff;font-weight:900}
.s.sunk{background:#8a1030}
#msg{position:fixed;left:0;right:0;text-align:center;font-weight:700;color:#cfe8ff;bottom:calc(56px + min(46vw,24vh,200px) + 10px)}
</style></head><body>
<div class="hud"><span>Ships left: CPU <b id="c">5</b></span><span>Wins <b id="b">0</b></span><span>You <b id="p">5</b></span></div>
<div class="bd" id="en"></div><div class="bd" id="me"></div><div id="msg"></div>
<script>
const N = 8, SIZES = [4, 3, 3, 2, 2];
let E, M, busy, targets = [], run = false;
G.set('b', G.getBest('battleship'));
function fleet() {
  const b = { cell: Array(N * N).fill(-1), shot: Array(N * N).fill(0), ships: [] };
  SIZES.forEach((sz, id) => {
    while (true) {
      const h = Math.random() < .5, r = Math.random() * (h ? N : N - sz + 1) | 0, c = Math.random() * (h ? N - sz + 1 : N) | 0;
      const cells = [...Array(sz)].map((_, k) => h ? r * N + c + k : (r + k) * N + c);
      if (cells.every(i => b.cell[i] < 0)) { cells.forEach(i => b.cell[i] = id); b.ships.push({ cells, hits: 0 }); break }
    }
  });
  return b;
}
const left = b => b.ships.filter(s => s.hits < s.cells.length).length;
function draw(el, b, mine) {
  el.innerHTML = ''; b.cell.forEach((id, i) => {
    const d = document.createElement('div'); let cls = 's';
    if (mine && id >= 0) cls += ' ship';
    if (b.shot[i]) cls += id >= 0 ? (b.ships[id].hits >= b.ships[id].cells.length ? ' hit sunk' : ' hit') : ' miss';
    d.className = cls; if (!mine) d.onclick = () => fire(i); el.appendChild(d);
  });
  G.set('c', left(E)); G.set('p', left(M));
}
function shoot(b, i) { b.shot[i] = 1; const id = b.cell[i]; if (id < 0) return 'miss'; const s = b.ships[id]; s.hits++; return s.hits >= s.cells.length ? 'sunk' : 'hit' }
function fire(i) {
  if (!run || busy || E.shot[i]) return;
  const r = shoot(E, i); draw(document.getElementById('en'), E, false);
  G.beep(r === 'miss' ? 250 : r === 'sunk' ? 1000 : 700, .12, r === 'miss' ? 'sine' : 'triangle');
  if (!left(E)) return end(true);
  G.set('msg', r === 'miss' ? 'Miss. CPU is firing…' : r === 'sunk' ? 'You sunk a ship! CPU is firing…' : 'Hit! CPU is firing…');
  busy = true; setTimeout(cpu, 650);
}
function cpu() {
  let i;
  while (targets.length) { const t = targets.pop(); if (!M.shot[t]) { i = t; break } }
  if (i == null) { const opts = M.shot.map((s, k) => !s && ((k / N | 0) + k) % 2 === 0 ? k : -1).filter(k => k >= 0); const all = M.shot.map((s, k) => s ? -1 : k).filter(k => k >= 0); const pool = opts.length ? opts : all; i = pool[Math.random() * pool.length | 0] }
  const r = shoot(M, i);
  if (r === 'hit') { const rr = i / N | 0, cc = i % N; if (rr > 0) targets.push(i - N); if (rr < N - 1) targets.push(i + N); if (cc > 0) targets.push(i - 1); if (cc < N - 1) targets.push(i + 1) }
  if (r === 'sunk') targets = [];
  draw(document.getElementById('me'), M, true); G.beep(r === 'miss' ? 200 : 130, .15, r === 'miss' ? 'sine' : 'sawtooth');
  if (!left(M)) return end(false);
  G.set('msg', (r === 'miss' ? 'CPU missed.' : r === 'sunk' ? 'CPU sunk your ship!' : 'CPU hit you!') + ' Your turn — tap the top grid');
  busy = false;
}
function end(win) {
  run = false; E.cell.forEach((id, i) => { if (id >= 0 && !E.shot[i]) document.getElementById('en').children[i].classList.add('ship') });
  if (win) { const w = G.getBest('battleship') + 1; G.setBest('battleship', w); G.set('b', w) }
  setTimeout(() => G.overlay(win ? 'Victory! 🚢' : 'Your fleet sank', win ? 'You sunk all 5 CPU ships.' : 'The CPU found all your ships.', 'Play again', start), 900);
}
function start() { E = fleet(); M = fleet(); targets = []; busy = false; run = true; draw(document.getElementById('en'), E, false); draw(document.getElementById('me'), M, true); G.set('msg', 'Your turn — tap the top grid to fire') }
start();
G.overlay('Battleship', 'The big grid hides 5 CPU ships. Tap squares to fire.<br>✕ = hit, • = miss.<br>Your own fleet is the small grid below. Sink theirs first!', 'Start', () => {});
</script></body></html>
