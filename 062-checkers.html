<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Checkers</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,64vh,480px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #5a3416;border-radius:6px}
.q{position:relative;background:#e8c89a}.q.d{background:#8a5a2a;cursor:pointer}
.q.can{box-shadow:inset 0 0 0 3px #ffe35a}.q.dest::after{content:'';position:absolute;inset:35%;border-radius:50%;background:#4dff88}
.q.sel{background:#b07a3a}
.p{position:absolute;inset:12%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,4vw,22px)}
.p.me{background:radial-gradient(circle at 35% 35%,#7ff,#0aa);box-shadow:0 3px 0 #066}.p.cpu{background:radial-gradient(circle at 35% 35%,#f8f,#a0a);box-shadow:0 3px 0 #606}
#msg{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-weight:700;color:#cfe8ff}
</style></head><body>
<div class="hud"><span>You <b id="p">12</b></span><span>Wins <b id="b">0</b></span><span>CPU <b id="c">12</b></span></div>
<div id="g"></div><div id="msg"></div>
<script>
const g = document.getElementById('g'), Q = [];
let B, sel = -1, legal = [], busy = false;
G.set('b', G.getBest('checkers'));
for (let i = 0; i < 64; i++) { const d = document.createElement('div'); d.className = 'q' + (((i >> 3) + (i & 7)) % 2 ? ' d' : ''); d.onclick = () => tap(i); g.appendChild(d); Q.push(d) }
const side = v => Math.sign(v), isKing = v => Math.abs(v) === 2;
function jumps(b, p, v, path, caps, out) {
  const r = p >> 3, c = p & 7, dirs = isKing(v) ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : (v > 0 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]); let any = false;
  for (const [dr, dc] of dirs) {
    const mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc; if (lr < 0 || lr > 7 || lc < 0 || lc > 7) continue;
    const m = mr * 8 + mc, l = lr * 8 + lc;
    if (side(b[m]) === -side(v) && !b[l] && !caps.includes(m)) {
      any = true; const promo = !isKing(v) && (v > 0 ? lr === 0 : lr === 7);
      const b2 = b.slice(); b2[p] = 0; b2[l] = v;
      if (promo) out.push({ path: [...path, l], caps: [...caps, m] }); else jumps(b2, l, v, [...path, l], [...caps, m], out);
    }
  }
  if (!any && caps.length) out.push({ path, caps });
}
function moves(b, s) {
  const caps = [], simple = [];
  for (let p = 0; p < 64; p++) {
    const v = b[p]; if (side(v) !== s) continue; const o = []; jumps(b, p, v, [p], [], o); caps.push(...o);
    const r = p >> 3, c = p & 7, dirs = isKing(v) ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : (v > 0 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]);
    for (const [dr, dc] of dirs) { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !b[nr * 8 + nc]) simple.push({ path: [p, nr * 8 + nc], caps: [] }) }
  }
  return caps.length ? caps : simple;
}
function apply(b, m) { const v = b[m.path[0]], e = m.path[m.path.length - 1]; b[m.path[0]] = 0; m.caps.forEach(k => b[k] = 0); b[e] = (!isKing(v) && (v > 0 ? e < 8 : e >= 56)) ? v * 2 : v }
const evalB = b => b.reduce((s, v, i) => s + (v === -1 ? -(3 + (i >> 3) * .1) : v === -2 ? -5 : v === 1 ? 3 + (7 - (i >> 3)) * .1 : v === 2 ? 5 : 0), 0); // positive = good for player
function cpuMove() {
  let best = 1e9, pick = null;
  for (const m of moves(B, -1)) {
    const b = B.slice(); apply(b, m); const rep = moves(b, 1); let worst = -1e9;
    if (!rep.length) worst = -100;
    for (const r of rep) { const b2 = b.slice(); apply(b2, r); const rr = moves(b2, -1); let w2 = 1e9; if (!rr.length) w2 = 100; for (const q of rr) { const b3 = b2.slice(); apply(b3, q); w2 = Math.min(w2, evalB(b3)) } worst = Math.max(worst, w2) }
    if (worst + Math.random() * .3 < best) { best = worst; pick = m }
  }
  return pick;
}
function render() {
  const my = busy ? [] : moves(B, 1), starts = new Set(my.map(m => m.path[0])), dests = new Set(my.filter(m => m.path[0] === sel).map(m => m.path[m.path.length - 1]));
  B.forEach((v, i) => {
    const q = Q[i]; q.classList.toggle('can', starts.has(i) && sel < 0); q.classList.toggle('sel', i === sel); q.classList.toggle('dest', dests.has(i));
    q.innerHTML = v ? `<div class="p ${v > 0 ? 'me' : 'cpu'}">${isKing(v) ? '👑' : ''}</div>` : '';
  });
  G.set('p', B.filter(v => v > 0).length); G.set('c', B.filter(v => v < 0).length);
}
function over(win) { busy = true; render(); if (win) { const w = G.getBest('checkers') + 1; G.setBest('checkers', w); G.set('b', w) } G.beep(win ? 880 : 150, .3, win ? 'triangle' : 'sawtooth'); setTimeout(() => G.overlay(win ? 'You win! 👑' : 'CPU wins', win ? 'You captured or blocked every CPU piece.' : 'You have no pieces or moves left.', 'Play again', newGame), 600) }
function tap(i) {
  if (busy) return; const my = moves(B, 1);
  if (my.some(m => m.path[0] === i)) { sel = i; G.beep(500, .03, 'triangle'); return render() }
  const m = my.find(m => m.path[0] === sel && m.path[m.path.length - 1] === i); if (!m) return;
  apply(B, m); sel = -1; G.beep(m.caps.length ? 800 : 400, .07, 'triangle'); busy = true; render();
  if (!moves(B, -1).length) return over(true);
  G.set('msg', 'CPU is thinking…');
  setTimeout(() => { const c = cpuMove(); apply(B, c); G.beep(c.caps.length ? 250 : 330, .07, 'triangle'); busy = false; if (!moves(B, 1).length) return over(false); G.set('msg', moves(B, 1)[0].caps.length ? 'You must capture!' : 'Your turn'); render() }, 500);
}
function newGame() { B = Array(64).fill(0); for (let i = 0; i < 64; i++) if (((i >> 3) + (i & 7)) % 2) { if (i < 24) B[i] = -1; else if (i >= 40) B[i] = 1 } sel = -1; busy = false; G.set('msg', 'Your turn — yellow squares can move'); render() }
newGame();
G.overlay('Checkers', 'Move diagonally forward. Jump over CPU pieces to capture them.<br>If you can capture, you must. Reach the far side to become a 👑 king.<br>Tap a piece, then tap a green dot.', 'Start', () => {});
</script></body></html>
