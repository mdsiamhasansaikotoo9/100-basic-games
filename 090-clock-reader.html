<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clock Reader</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>#opts{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,400px)}
#opts button{font:inherit;font-weight:900;font-size:26px;padding:14px 0;border:0;border-radius:14px;background:#2f2080;color:#fff}#opts button.ok{background:#13a05a}#opts button.no{background:#a01340}</style></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span>Time <b id="t">60</b></span><span>Best <b id="b">0</b></span></div>
<div id="opts"></div>
<script>
const K = G.canvas(), x = K.x;
let h = 3, m = 0, shownH = 3, shownM = 0, score = 0, time = 0, run = false, busy = false;
G.set('b', G.best('clock'));
const opts = document.getElementById('opts'), btns = [];
for (let i = 0; i < 4; i++) { const b = document.createElement('button'); b.onclick = () => pick(b); opts.appendChild(b); btns.push(b) }
const fmt = (hh, mm) => hh + ':' + String(mm).padStart(2, '0');
function round() {
  const step = score < 5 ? 15 : score < 12 ? 5 : 1; h = 1 + (Math.random() * 12 | 0); m = (Math.random() * (60 / step) | 0) * step;
  const right = fmt(h, m), set = new Set([right]);
  const tricks = [fmt(m === 0 ? 12 : (m / 5 | 0) || 12, (h % 12) * 5), fmt(h % 12 + 1, m), fmt(h, (m + 30) % 60), fmt(h === 1 ? 12 : h - 1, m), fmt(h, (m + step) % 60), fmt(h, (m + 60 - step) % 60)];
  for (const t of tricks.sort(() => Math.random() - .5)) { if (set.size >= 4) break; if (/^(1[0-2]|[1-9]):[0-5]\d$/.test(t)) set.add(t) }
  while (set.size < 4) set.add(fmt(1 + (Math.random() * 12 | 0), (Math.random() * 12 | 0) * 5));
  [...set].sort(() => Math.random() - .5).forEach((v, i) => { btns[i].textContent = v; btns[i].className = '' }); busy = false;
}
function pick(b) {
  if (!run || busy) return; busy = true;
  if (b.textContent === fmt(h, m)) { score++; time += 1; G.set('s', score); b.className = 'ok'; G.beep(800, .1, 'triangle') }
  else { time -= 3; b.className = 'no'; btns.find(q => q.textContent === fmt(h, m)).className = 'ok'; G.beep(150, .2, 'sawtooth') }
  setTimeout(() => { if (run) round() }, 600);
}
function start() { score = 0; time = 60; run = true; G.set('s', 0); round() }
G.loop(dt => {
  if (run) { time -= dt; G.set('t', Math.max(0, Math.ceil(time))); if (time <= 0) { run = false; G.set('b', G.best('clock', score)); G.overlay("Time's up! ⏰", 'You read ' + score + ' clocks correctly.', 'Play again', start) } }
  // smooth hands
  const targetM = h * 60 + m; let cur = shownH * 60 + shownM, d = targetM - cur; while (d > 360) d -= 720; while (d < -360) d += 720; cur += d * Math.min(1, dt * 10); shownH = Math.floor(cur / 60); shownM = cur - shownH * 60;
  x.fillStyle = '#0b0820'; x.fillRect(0, 0, K.W, K.H);
  const cx = K.W / 2, cy = K.H * .38, R = Math.min(K.W * .4, K.H * .26);
  x.fillStyle = '#f4f1ff'; x.shadowColor = '#3df5ff'; x.shadowBlur = 30; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill(); x.shadowBlur = 0;
  x.strokeStyle = '#3a2a90'; x.lineWidth = 8; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();
  for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, big = i % 5 === 0; x.strokeStyle = '#0b0820'; x.lineWidth = big ? 3 : 1; x.beginPath(); x.moveTo(cx + Math.sin(a) * R * (big ? .86 : .92), cy - Math.cos(a) * R * (big ? .86 : .92)); x.lineTo(cx + Math.sin(a) * R * .97, cy - Math.cos(a) * R * .97); x.stroke() }
  x.fillStyle = '#0b0820'; x.font = `800 ${R * .17}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let n = 1; n <= 12; n++) { const a = n / 12 * Math.PI * 2; x.fillText(n, cx + Math.sin(a) * R * .72, cy - Math.cos(a) * R * .72) }
  const tot = shownH * 60 + shownM, ha = (tot / 720) * Math.PI * 2, ma = (shownM / 60) * Math.PI * 2;
  x.lineCap = 'round'; x.strokeStyle = '#0b0820'; x.lineWidth = 8; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(ha) * R * .5, cy - Math.cos(ha) * R * .5); x.stroke();
  x.strokeStyle = '#ff3df0'; x.lineWidth = 5; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(ma) * R * .8, cy - Math.cos(ma) * R * .8); x.stroke();
  x.fillStyle = '#ff3df0'; x.beginPath(); x.arc(cx, cy, 7, 0, 7); x.fill();
  if (run) { x.fillStyle = '#cfe8ff'; x.font = '700 15px system-ui'; x.fillText('What time is it?', cx, cy + R + 28) }
});
G.overlay('Clock Reader', 'Read the clock and tap the right time.<br>Short black hand = hour. Long pink hand = minutes.<br>It starts easy and gets trickier. 60 seconds!', 'Start', start);
</script></body></html>
