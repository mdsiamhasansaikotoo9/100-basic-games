<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Shooter</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span>Lives <b id="l">3</b></span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x;
let ship = null, bul = [], en = [], parts = [], score = 0, lives = 3, run = false, fireT = 0, spawnT = 0, t = 0, inv = 0, keys = {};
const stars = [...Array(90)].map(() => ({ x: Math.random(), y: Math.random(), s: Math.random() * 2 + .5 }));
G.set('b', G.best('shooter'));
function start() { ship = { x: K.W / 2 }; bul = []; en = []; score = 0; lives = 3; t = 0; spawnT = 1; inv = 0; run = true; G.set('s', 0); G.set('l', 3) }
const mv = e => { if (ship) ship.x = e.clientX };
addEventListener('pointermove', mv); addEventListener('pointerdown', mv);
addEventListener('keydown', e => keys[e.key] = 1); addEventListener('keyup', e => keys[e.key] = 0);
function boom(px, py, col, n = 16) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = Math.random() * 220; parts.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col }) } }
function hurt() {
  lives--; G.set('l', lives); inv = 1.5; G.beep(140, .3, 'sawtooth'); boom(ship.x, K.H - 90, '#3df5ff', 24);
  if (lives <= 0) { run = false; G.set('b', G.best('shooter', score)); G.overlay('Game Over', 'Score: ' + score, 'Play again', start) }
}
function update(dt) {
  for (const s of stars) { s.y += s.s * dt * .08; if (s.y > 1) s.y = 0 }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.8 } parts = parts.filter(p => p.life > 0);
  if (!run) return;
  t += dt; inv = Math.max(0, inv - dt);
  if (keys.ArrowLeft) ship.x -= 600 * dt; if (keys.ArrowRight) ship.x += 600 * dt;
  ship.x = Math.max(20, Math.min(K.W - 20, ship.x));
  const sy = K.H - 90;
  fireT -= dt; if (fireT <= 0) { fireT = .2; bul.push({ x: ship.x, y: sy - 20 }); G.beep(1200, .02, 'square', .015) }
  spawnT -= dt;
  if (spawnT <= 0) {
    const big = Math.random() < Math.min(.3, t * .008);
    en.push({ bx: 30 + Math.random() * (K.W - 60), y: -30, ph: Math.random() * 7, vy: 70 + t * 2.5 + Math.random() * 40, hp: big ? 3 : 1, big, r: big ? 22 : 15, x: 0 });
    spawnT = Math.max(.3, 1.1 - t * .015);
  }
  for (const b of bul) b.y -= 700 * dt; bul = bul.filter(b => b.y > -10 && !b.dead);
  for (const e of en) {
    e.y += e.vy * dt; e.x = Math.max(e.r, Math.min(K.W - e.r, e.bx + Math.sin(e.ph + e.y * .02) * 40));
    for (const b of bul) if (!b.dead && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
      b.dead = 1; e.hp--;
      if (e.hp <= 0) { e.dead = 1; score += e.big ? 30 : 10; G.set('s', score); boom(e.x, e.y, e.big ? '#ff8a3d' : '#ff3df0'); G.beep(220, .1, 'triangle', .08) }
      else G.beep(500, .03, 'square', .04);
      break;
    }
    if (!e.dead && !inv && Math.hypot(e.x - ship.x, e.y - sy) < e.r + 16) { e.dead = 1; boom(e.x, e.y, '#ff3df0'); hurt(); if (!run) return }
    if (!e.dead && e.y > K.H + 30) { e.dead = 1; if (!inv) { hurt(); if (!run) return } }
  }
  en = en.filter(e => !e.dead);
}
function draw() {
  x.fillStyle = '#05030f'; x.fillRect(0, 0, K.W, K.H);
  x.fillStyle = '#bcd4ff'; for (const s of stars) { x.globalAlpha = s.s / 3; x.fillRect(s.x * K.W, s.y * K.H, s.s, s.s) } x.globalAlpha = 1;
  x.shadowBlur = 12;
  x.shadowColor = x.fillStyle = '#ffe35a'; for (const b of bul) x.fillRect(b.x - 2, b.y - 8, 4, 12);
  for (const e of en) {
    const c = e.big ? '#ff8a3d' : '#ff3df0'; x.shadowColor = x.fillStyle = c;
    x.beginPath(); x.ellipse(e.x, e.y, e.r, e.r * .55, 0, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(e.x, e.y - e.r * .3, e.r * .35, Math.PI, 0); x.fill();
  }
  if (ship && run && !(inv && (t * 10 | 0) % 2)) {
    const sy = K.H - 90; x.shadowColor = x.fillStyle = '#3df5ff';
    x.beginPath(); x.moveTo(ship.x, sy - 22); x.lineTo(ship.x + 18, sy + 16); x.lineTo(ship.x, sy + 8); x.lineTo(ship.x - 18, sy + 16); x.closePath(); x.fill();
    x.fillStyle = '#ff8a3d'; x.fillRect(ship.x - 3, sy + 10, 6, 6 + Math.random() * 8);
  }
  x.shadowBlur = 0;
  for (const p of parts) { x.globalAlpha = p.life; x.fillStyle = p.col; x.fillRect(p.x - 2, p.y - 2, 4, 4) } x.globalAlpha = 1;
}
G.loop(dt => { update(dt); draw() });
G.overlay('Space Shooter', 'Drag (or arrow keys) to move. Your ship fires by itself.<br>Shoot the saucers. Orange ones take 3 hits.<br>Don\'t let them pass you!', 'Start', start);
</script></body></html>
