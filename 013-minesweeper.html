<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minesweeper</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,64vh,460px);aspect-ratio:1;display:grid;
  grid-template-columns:repeat(9,1fr);gap:3px}
.m{border-radius:6px;background:#2f2080;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:clamp(14px,4.6vw,24px);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.m.o{background:#130d2c;box-shadow:none}
.m.boom{background:#ff4d6d}
#mode{position:fixed;right:12px;bottom:12px;z-index:20;font:inherit;font-weight:800;font-size:16px;color:#0b0820;
  background:#3df5ff;border:0;border-radius:999px;padding:10px 18px}
#mode.f{background:#ffe35a}
</style></head><body>
<div class="hud"><span>🚩 <b id="f">10</b></span><span>Time <b id="t">0</b></span><span>Best <b id="b">–</b></span></div>
<div id="g"></div><button id="mode">⛏ Dig</button>
<script>
const N = 9, M = 10, g = document.getElementById('g'), NUMC = ['', '#3df5ff', '#4dff88', '#ff4d6d', '#b44dff', '#ff8a3d', '#3dffd0', '#fff', '#aaa'];
let cells, first, done, flag = false, time = 0, ticking = false, flags;
const showBest = () => G.set('b', G.best('mines', null, true) || '–'); showBest();
const modeBtn = document.getElementById('mode');
modeBtn.onclick = () => { flag = !flag; modeBtn.textContent = flag ? '🚩 Flag' : '⛏ Dig'; modeBtn.classList.toggle('f', flag) };
const nb = i => { const r = i / N | 0, c = i % N, o = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if ((dr || dc) && rr >= 0 && cc >= 0 && rr < N && cc < N) o.push(rr * N + cc) } return o };
function start() {
  g.innerHTML = ''; cells = []; first = true; done = false; time = 0; ticking = false; flags = 0; G.set('t', 0); G.set('f', M);
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div'); d.className = 'm'; g.appendChild(d);
    const c = { el: d, mine: 0, n: 0, open: 0, flag: 0 }; cells.push(c);
    d.onclick = () => flag ? toggle(i) : dig(i);
    d.oncontextmenu = e => { e.preventDefault(); toggle(i) };
  }
}
function plant(safe) {
  const no = new Set([safe, ...nb(safe)]); let k = 0;
  while (k < M) { const i = Math.random() * N * N | 0; if (!cells[i].mine && !no.has(i)) { cells[i].mine = 1; k++ } }
  cells.forEach((c, i) => c.n = nb(i).filter(j => cells[j].mine).length);
}
function toggle(i) {
  const c = cells[i]; if (done || c.open) return;
  c.flag ^= 1; flags += c.flag ? 1 : -1; c.el.textContent = c.flag ? '🚩' : ''; G.set('f', M - flags); G.beep(600, .04, 'triangle', .05);
}
function dig(i) {
  const c = cells[i]; if (done || c.open || c.flag) return;
  if (first) { plant(i); first = false; ticking = true }
  if (c.mine) return lose(i);
  const q = [i];
  while (q.length) {
    const j = q.pop(), d = cells[j]; if (d.open || d.flag) continue;
    d.open = 1; d.el.classList.add('o'); d.el.textContent = d.n || ''; d.el.style.color = NUMC[d.n];
    if (!d.n) nb(j).forEach(k => { if (!cells[k].open) q.push(k) });
  }
  G.beep(420, .04, 'square', .04);
  if (cells.filter(c => c.open).length === N * N - M) win();
}
function lose(i) {
  done = true; ticking = false; G.beep(90, .6, 'sawtooth', .15);
  cells.forEach(c => { if (c.mine) { c.el.textContent = '💣'; c.el.classList.add('o') } });
  cells[i].el.classList.add('boom');
  setTimeout(() => G.overlay('Boom!', 'You hit a mine.', 'Play again', start), 900);
}
function win() {
  done = true; ticking = false; const s = Math.ceil(time); G.best('mines', s, true); showBest(); G.beep(880, .3, 'triangle');
  setTimeout(() => G.overlay('Cleared! 🎉', 'Time: ' + s + ' seconds.<br>Faster is better.', 'Play again', start), 500);
}
G.loop(dt => { if (ticking) { time += dt; G.set('t', Math.floor(time)) } });
start();
G.overlay('Minesweeper', 'Tap to dig. Numbers show how many mines touch that square.<br>Use the button at the bottom right to switch to 🚩 Flag mode.<br>Open every safe square to win.', 'Start', () => {});
</script></body></html>
