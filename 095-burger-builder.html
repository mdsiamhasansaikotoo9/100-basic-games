<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Burger Builder</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#box{position:fixed;inset:56px 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px}
#title{font-weight:800;color:#ffe35a;text-align:center;min-height:24px}
#stack{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;flex:1;width:100%;gap:2px;padding:10px 0}
#stack div{font-size:clamp(28px,8vw,40px);line-height:1;padding:2px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
#stack div.bad{background:#a01340}
#bar{width:min(10vw,40px)}#time{height:6px;background:#ffe35a;border-radius:3px;width:100%;transition:width .1s linear}
#pantry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(94vw,420px)}
#pantry button{font-size:32px;padding:8px 0;border:0;border-radius:14px;background:#2f2080;cursor:pointer}
#pantry button small{display:block;font-size:11px;color:#cfe8ff;font-family:system-ui}
</style></head><body>
<div class="hud"><span>Burgers <b id="s">0</b></span><span id="l">❤️❤️❤️</span><span>Best <b id="b">0</b></span></div>
<div id="box"><div id="title"></div><div style="width:min(94vw,420px)"><div id="time"></div></div><div id="stack"></div><div id="pantry"></div></div>
<script>
const ING = [['🥬', 'Lettuce'], ['🍅', 'Tomato'], ['🧀', 'Cheese'], ['🥩', 'Meat'], ['🧅', 'Onion'], ['🥓', 'Bacon'], ['🥒', 'Pickle'], ['🍳', 'Egg']];
let order = [], built = [], score = 0, lives = 3, phase = 'idle', timer = 0, tmax = 1;
G.set('b', G.best('burger'));
const pantry = document.getElementById('pantry');
ING.forEach(([e, n], i) => { const b = document.createElement('button'); b.innerHTML = e + `<small>${n}</small>`; b.onclick = () => add(i); pantry.appendChild(b) });
function show(list, bad) { document.getElementById('stack').innerHTML = '<div>🍞</div>' + list.map((i, k) => `<div class="${bad === k ? 'bad' : ''}">${ING[i][0]}</div>`).join('') + (phase === 'show' ? '<div>🍔</div>' : '') }
function newOrder() {
  const n = Math.min(2 + Math.floor(score / 2), 9); order = [...Array(n)].map(() => Math.random() * ING.length | 0); built = [];
  phase = 'show'; show(order); G.set('title', 'Remember this order! (bottom → top)'); tmax = timer = Math.max(1.6, .9 + n * .55);
}
function add(i) {
  if (phase !== 'build') return; built.push(i); const k = built.length - 1;
  if (order[k] !== i) {
    show(built, k); lives--; G.set('l', '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives))); G.beep(150, .2, 'sawtooth'); phase = 'wait';
    G.set('title', 'Oops! It was ' + ING[order[k]][1] + '.');
    if (lives <= 0) return setTimeout(() => G.overlay('Kitchen closed!', 'You made ' + score + ' perfect burgers.', 'Play again', start), 900);
    return setTimeout(newOrder, 1200);
  }
  show(built); G.beep(400 + k * 60, .05, 'triangle');
  if (built.length === order.length) { phase = 'wait'; score++; G.set('s', score); G.set('b', G.best('burger', score)); G.set('title', 'Perfect burger! 🍔'); G.beep(900, .2, 'triangle'); document.getElementById('stack').innerHTML += '<div>🍞</div>'; setTimeout(newOrder, 900) }
}
function start() { score = 0; lives = 3; G.set('s', 0); G.set('l', '❤️❤️❤️'); newOrder() }
G.loop(dt => {
  if (phase === 'show') { timer -= dt; document.getElementById('time').style.width = Math.max(0, timer / tmax * 100) + '%'; if (timer <= 0) { phase = 'build'; show([]); G.set('title', 'Now build it! Tap ingredients from the bottom up.') } }
  else document.getElementById('time').style.width = '0%';
});
G.overlay('Burger Builder', 'A customer shows you their burger order for a few seconds.<br>Remember it, then build it — tap ingredients from the bottom up.<br>Orders get bigger. 3 mistakes and the kitchen closes!', 'Start', start);
</script></body></html>
