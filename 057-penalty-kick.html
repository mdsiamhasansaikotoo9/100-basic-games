<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penalty Kick</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Goals <b id="s">0</b></span><span id="l">⚽⚽⚽</span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x;
let ball = null, kick = null, keeper, score = 0, lives = 3, run = false, sx, sy, msg = null, t = 0, path = [];
G.set('b', G.best('penalty'));
const GL = () => ({ l: K.W * .12, r: K.W * .88, top: K.H * .16, line: K.H * .36 });
function reset() { ball = { x: K.W / 2, y: K.H - 130, s: 1 }; kick = null; const g = GL(); keeper = { x: K.W / 2, tx: K.W / 2, w: Math.min(70, K.W * .17), dive: 0, sway: Math.random() * 7 }; path = [] }
function start() { score = 0; lives = 3; run = true; G.set('s', 0); G.set('l', '⚽⚽⚽'); reset() }
addEventListener('pointerdown', e => { if (run && !kick) { sx = e.clientX; sy = e.clientY; path = [{ x: sx, y: sy }] } });
addEventListener('pointermove', e => { if (sx != null) path.push({ x: e.clientX, y: e.clientY }) });
addEventListener('pointerup', e => {
  if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (dy > -40) { path = []; return }
  const g = GL(), k = (ball.y - (g.top + g.line) / 2) / -dy, tx = ball.x + dx * k;
  // curve from the swipe's bend
  let bend = 0; if (path.length > 3) { const mid = path[path.length / 2 | 0]; bend = (mid.x - (sx0 = (path[0].x + e.clientX) / 2)) }
  const ty = Math.max(g.top - 30, Math.min(g.line - 8, (g.top + g.line) / 2 + (Math.abs(dy) < 160 ? 40 : Math.abs(dy) > 400 ? -50 : 0)));
  kick = { t: 0, dur: .55, x0: ball.x, y0: ball.y, tx, ty, bend: -bend * 1.2 };
  // keeper guesses
  const smart = Math.min(.65, .3 + score * .04); keeper.tx = Math.random() < smart ? tx : g.l + Math.random() * (g.r - g.l); keeper.dive = 1;
  G.beep(250, .08, 'triangle'); path = [];
});
let sx0 = 0;
function result(goal, text) {
  msg = { t: text, life: 1.3, good: goal };
  if (goal) { score++; G.set('s', score); G.beep(900, .2, 'triangle'); setTimeout(() => G.beep(1200, .25, 'triangle'), 150) }
  else { lives--; G.set('l', '⚽'.repeat(Math.max(0, lives)) + '❌'.repeat(3 - Math.max(0, lives))); G.beep(150, .3, 'sawtooth') }
  setTimeout(() => { if (lives <= 0) { run = false; G.set('b', G.best('penalty', score)); G.overlay('Full time!', 'Goals: ' + score, 'Play again', start) } else reset() }, 1100);
}
G.loop(dt => {
  t += dt; if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null }
  const g = GL();
  if (keeper) {
    if (!keeper.dive) keeper.x = K.W / 2 + Math.sin(t * 2 + keeper.sway) * K.W * .12;
    else keeper.x += Math.max(-dt * 520, Math.min(dt * 520, keeper.tx - keeper.x));
    keeper.x = Math.max(g.l + keeper.w / 2, Math.min(g.r - keeper.w / 2, keeper.x));
  }
  if (kick && !kick.done) {
    kick.t += dt; const p = Math.min(1, kick.t / kick.dur), e = p;
    ball.x = kick.x0 + (kick.tx - kick.x0) * e + Math.sin(p * Math.PI) * kick.bend; ball.y = kick.y0 + (kick.ty - kick.y0) * e - Math.sin(p * Math.PI) * 40; ball.s = 1 - p * .5;
    if (p >= 1) {
      kick.done = 1;
      if (ball.x < g.l || ball.x > g.r || ball.y < g.top) result(false, 'Missed the goal!');
      else if (Math.abs(ball.x - keeper.x) < keeper.w / 2 + 10 && ball.y > g.top + 10) result(false, 'Saved! 🧤');
      else result(true, 'GOAL! ⚽');
    }
  }
  // draw
  x.fillStyle = '#0d5a2a'; x.fillRect(0, 0, K.W, K.H);
  for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#0f6630' : '#0d5a2a'; x.fillRect(0, g.line + i * (K.H - g.line) / 8, K.W, (K.H - g.line) / 8) }
  x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(g.l, g.top, g.r - g.l, g.line - g.top);
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 1; for (let i = g.l; i < g.r; i += 14) { x.beginPath(); x.moveTo(i, g.top); x.lineTo(i, g.line); x.stroke() } for (let j = g.top; j < g.line; j += 14) { x.beginPath(); x.moveTo(g.l, j); x.lineTo(g.r, j); x.stroke() }
  x.strokeStyle = '#fff'; x.lineWidth = 6; x.beginPath(); x.moveTo(g.l, g.line); x.lineTo(g.l, g.top); x.lineTo(g.r, g.top); x.lineTo(g.r, g.line); x.stroke();
  x.lineWidth = 2; x.beginPath(); x.moveTo(0, g.line); x.lineTo(K.W, g.line); x.stroke(); x.beginPath(); x.ellipse(K.W / 2, K.H - 130, 4, 3, 0, 0, 7); x.stroke();
  if (keeper) { const kx = keeper.x, ky = g.line - 70; x.fillStyle = '#ffe35a'; x.fillRect(kx - keeper.w / 2, ky + 18, keeper.w, 30); x.fillStyle = '#ffd0a0'; x.beginPath(); x.arc(kx, ky + 8, 12, 0, 7); x.fill(); x.fillStyle = '#ffe35a'; x.fillRect(kx - keeper.w / 2 - 6, ky + 14, 8, 22); x.fillRect(kx + keeper.w / 2 - 2, ky + 14, 8, 22); x.fillStyle = '#222'; x.fillRect(kx - 14, ky + 48, 10, 22); x.fillRect(kx + 4, ky + 48, 10, 22) }
  if (ball) { const r = 18 * ball.s; x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(ball.x, ball.y + r, r, r * .35, 0, 0, 7); x.fill(); x.font = `${r * 2}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('⚽', ball.x, ball.y) }
  if (path.length > 1) { x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 4; x.beginPath(); path.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.stroke() }
  if (msg) { x.globalAlpha = Math.min(1, msg.life); x.fillStyle = msg.good ? '#ffe35a' : '#ff4d6d'; x.font = '900 34px system-ui'; x.textAlign = 'center'; x.fillText(msg.t, K.W / 2, K.H * .55); x.globalAlpha = 1 }
  if (run && !kick) { x.fillStyle = 'rgba(255,255,255,.6)'; x.font = '700 14px system-ui'; x.textAlign = 'center'; x.fillText('swipe up from the ball to shoot', K.W / 2, K.H - 70) }
});
G.overlay('Penalty Kick', 'Swipe up to kick toward the goal.<br>Aim for the corners — curve your swipe to bend the ball.<br>The keeper gets smarter. 3 misses and it\'s full time.', 'Start', start);
</script></body></html>
