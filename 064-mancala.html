<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mancala</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,620px);display:grid;grid-template-columns:1.2fr repeat(6,1fr) 1.2fr;grid-template-rows:1fr 1fr;gap:6px;
  padding:10px;background:#7a4a1e;border-radius:24px;box-shadow:0 0 30px rgba(255,177,61,.3);aspect-ratio:2.6}
.pit{background:#4a2a0e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(15px,4.5vw,24px);color:#ffe9c0;cursor:pointer;box-shadow:inset 0 4px 8px rgba(0,0,0,.5)}
.pit.mine.ok{box-shadow:inset 0 4px 8px rgba(0,0,0,.5),0 0 0 3px #3df5ff}
.pit.flash{background:#7a5a2e}
.store{grid-row:1/3;border-radius:40px;background:#4a2a0e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(20px,6vw,32px);color:#ffe35a}
.store small{font-size:11px;color:#ffe9c0;opacity:.7}
#msg{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-weight:700;color:#cfe8ff;padding:0 10px}
</style></head><body>
<div class="hud"><span>Wins <b id="b">0</b></span></div>
<div id="board"></div><div id="msg"></div>
<script>
// indices: 0-5 your pits (left→right, bottom), 6 your store, 7-12 CPU pits (right→left, top), 13 CPU store
let S, busy = false;
G.set('b', G.getBest('mancala'));
const board = document.getElementById('board'), el = {};
function build() {
  board.innerHTML = '';
  const st2 = document.createElement('div'); st2.className = 'store'; st2.style.gridColumn = '1'; board.appendChild(st2); el[13] = st2;
  for (let k = 12; k >= 7; k--) { const d = document.createElement('div'); d.className = 'pit'; d.style.gridRow = '1'; board.appendChild(d); el[k] = d }
  const st1 = document.createElement('div'); st1.className = 'store'; st1.style.gridColumn = '8'; board.appendChild(st1); el[6] = st1;
  for (let k = 0; k <= 5; k++) { const d = document.createElement('div'); d.className = 'pit mine'; d.style.gridRow = '2'; d.style.gridColumn = String(k + 2); d.onclick = () => play(k); board.appendChild(d); el[k] = d }
}
function render() {
  for (let i = 0; i < 14; i++) el[i].innerHTML = (i === 6 || i === 13) ? `<small>${i === 6 ? 'YOU' : 'CPU'}</small>${S[i]}` : S[i];
  for (let k = 0; k <= 5; k++) el[k].classList.toggle('ok', !busy && S[k] > 0);
}
function sow(s, pit, who) { // returns {s, again}
  s = s.slice(); let n = s[pit], i = pit; s[pit] = 0; const skip = who === 1 ? 13 : 6;
  while (n) { i = (i + 1) % 14; if (i === skip) continue; s[i]++; n-- }
  const mine = who === 1 ? (i >= 0 && i <= 5) : (i >= 7 && i <= 12), store = who === 1 ? 6 : 13;
  if (mine && s[i] === 1 && s[12 - i] > 0) { s[store] += s[12 - i] + 1; s[12 - i] = 0; s[i] = 0 }
  return { s, again: i === store, last: i };
}
const done = s => s.slice(0, 6).every(v => !v) || s.slice(7, 13).every(v => !v);
function finalize(s) { s = s.slice(); for (let k = 0; k < 6; k++) { s[6] += s[k]; s[k] = 0; s[13] += s[k + 7]; s[k + 7] = 0 } return s }
function mm(s, depth, who) {
  if (done(s)) { const f = finalize(s); return f[13] - f[6] }
  if (!depth) return s[13] - s[6];
  const pits = who === 2 ? [7, 8, 9, 10, 11, 12] : [0, 1, 2, 3, 4, 5]; let best = who === 2 ? -1e9 : 1e9;
  for (const p of pits) { if (!s[p]) continue; const r = sow(s, p, who), v = mm(r.s, depth - 1, r.again ? who : 3 - who); best = who === 2 ? Math.max(best, v) : Math.min(best, v) }
  return best;
}
function cpuPick() { let best = -1e9, pick = 7; for (let p = 7; p <= 12; p++) { if (!S[p]) continue; const r = sow(S, p, 2), v = mm(r.s, 4, r.again ? 2 : 1) + Math.random() * .5; if (v > best) { best = v; pick = p } } return pick }
function flash(i) { el[i].classList.add('flash'); setTimeout(() => el[i].classList.remove('flash'), 300) }
function end() {
  S = finalize(S); busy = true; render(); const y = S[6], c = S[13];
  if (y > c) { const w = G.getBest('mancala') + 1; G.setBest('mancala', w); G.set('b', w) }
  G.beep(y > c ? 880 : 150, .3, y > c ? 'triangle' : 'sawtooth');
  setTimeout(() => G.overlay(y > c ? 'You win! 🎉' : c > y ? 'CPU wins' : 'Draw', 'You ' + y + ' – ' + c + ' CPU', 'Play again', newGame), 700);
}
function cpuTurn() {
  if (done(S)) return end();
  const p = cpuPick(), r = sow(S, p, 2); S = r.s; flash(p); flash(r.last); G.beep(330, .07, 'triangle'); render();
  if (done(S)) return end();
  if (r.again) { G.set('msg', 'CPU landed in its store — CPU goes again'); return setTimeout(cpuTurn, 800) }
  busy = false; G.set('msg', 'Your turn — tap one of your pits (bottom row)'); render();
}
function play(k) {
  if (busy || !S[k]) return;
  const r = sow(S, k, 1); S = r.s; flash(r.last); G.beep(520, .07, 'triangle'); render();
  if (done(S)) return end();
  if (r.again) { G.set('msg', 'Landed in your store — go again!'); G.beep(800, .1, 'triangle'); return }
  busy = true; render(); G.set('msg', 'CPU is thinking…'); setTimeout(cpuTurn, 700);
}
function newGame() { S = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0]; busy = false; G.set('msg', 'Your turn — tap one of your pits (bottom row)'); render() }
build(); newGame();
G.overlay('Mancala', 'Tap one of your pits (bottom row). Its stones are dropped one by one, moving right and around the board.<br>Last stone in your store (right) = go again.<br>Last stone in an empty pit of yours = capture the stones opposite. Most stones in your store wins.', 'Start', () => {});
</script></body></html>
