<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Connect Four</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script>
<style>
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,66vh,480px);aspect-ratio:7/6;display:grid;
  grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;background:#2f2080;border-radius:16px;box-sizing:border-box;box-shadow:0 0 30px rgba(61,245,255,.2)}
.h{border-radius:50%;background:#0b0820;cursor:pointer;transition:background .15s}
.h.p1{background:#3df5ff;box-shadow:0 0 12px #3df5ff}.h.p2{background:#ff3df0;box-shadow:0 0 12px #ff3df0}
.h.win{outline:3px solid #fff}
#msg{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-weight:700;color:#cfe8ff}
</style></head><body>
<div class="hud"><span>You <b id="w">0</b></span><span>Draw <b id="d">0</b></span><span>CPU <b id="l">0</b></span></div>
<div id="g"></div><div id="msg"></div>
<script>
const R = 6, C = 7, g = document.getElementById('g'), H = [];
let B, busy, st = { w: 0, d: 0, l: 0 };
for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const d = document.createElement('div'); d.className = 'h'; d.onclick = () => play(c); g.appendChild(d); H.push(d) }
const free = (b, c) => { for (let r = R - 1; r >= 0; r--) if (!b[r][c]) return r; return -1 };
function lines(b, p) { // returns winning cells or null
  const D = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of D) {
    const cells = []; for (let k = 0; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= R || cc < 0 || cc >= C || b[rr][cc] !== p) break; cells.push([rr, cc]) }
    if (cells.length === 4) return cells;
  }
  return null;
}
function evalB(b) {
  let s = 0; for (let r = 0; r < R; r++) s += (b[r][3] === 2 ? 3 : b[r][3] === 1 ? -3 : 0);
  const D = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of D) {
    const er = r + dr * 3, ec = c + dc * 3; if (er < 0 || er >= R || ec < 0 || ec >= C) continue;
    let a = 0, o = 0; for (let k = 0; k < 4; k++) { const v = b[r + dr * k][c + dc * k]; if (v === 2) a++; else if (v === 1) o++ }
    if (a && o) continue; if (a === 3) s += 5; else if (a === 2) s += 2; if (o === 3) s -= 6; else if (o === 2) s -= 2;
  }
  return s;
}
function nega(b, depth, al, be, p) {
  if (lines(b, 3 - p)) return -1000 - depth;
  const moves = [3, 2, 4, 1, 5, 0, 6].filter(c => free(b, c) >= 0);
  if (!moves.length) return 0; if (!depth) return p === 2 ? evalB(b) : -evalB(b);
  let best = -1e9;
  for (const c of moves) { const r = free(b, c); b[r][c] = p; const v = -nega(b, depth - 1, -be, -al, 3 - p); b[r][c] = 0; if (v > best) best = v; if (v > al) al = v; if (al >= be) break }
  return best;
}
function cpuMove() {
  let best = -1e9, pick = 3;
  for (const c of [3, 2, 4, 1, 5, 0, 6]) { const r = free(B, c); if (r < 0) continue; B[r][c] = 2; const v = -nega(B, 4, -1e9, 1e9, 1) + Math.random(); B[r][c] = 0; if (v > best) { best = v; pick = c } }
  return pick;
}
function render() { for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) H[r * C + c].className = 'h' + (B[r][c] ? ' p' + B[r][c] : '') }
function drop(c, p) { const r = free(B, c); if (r < 0) return false; B[r][c] = p; render(); G.beep(p === 1 ? 500 : 340, .06, 'triangle'); return true }
function end() {
  const w1 = lines(B, 1), w2 = lines(B, 2), full = B[0].every(Boolean);
  if (!w1 && !w2 && !full) return false;
  (w1 || w2 || []).forEach(([r, c]) => H[r * C + c].classList.add('win'));
  if (w1) { st.w++; G.set('msg', 'You win! 🎉'); G.beep(880, .3, 'triangle') } else if (w2) { st.l++; G.set('msg', 'CPU wins'); G.beep(180, .3, 'sawtooth') } else { st.d++; G.set('msg', 'Draw') }
  G.set('w', st.w); G.set('d', st.d); G.set('l', st.l); busy = true;
  setTimeout(() => G.overlay(w1 ? 'You win! 🎉' : w2 ? 'CPU wins' : 'Draw', 'Score: You ' + st.w + ' – ' + st.l + ' CPU', 'Play again', newGame), 900);
  return true;
}
function play(c) {
  if (busy || free(B, c) < 0) return;
  drop(c, 1); if (end()) return;
  busy = true; G.set('msg', 'CPU is thinking…');
  setTimeout(() => { drop(cpuMove(), 2); if (!end()) { busy = false; G.set('msg', 'Your turn') } }, 350);
}
function newGame() { B = [...Array(R)].map(() => Array(C).fill(0)); busy = false; render(); G.set('msg', 'Your turn — tap a column') }
newGame();
G.overlay('Connect Four', 'Tap a column to drop your blue disc.<br>Get 4 in a row — across, up, or diagonal — before the CPU.', 'Start', () => {});
</script></body></html>
