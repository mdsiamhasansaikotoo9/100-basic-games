<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Missile Defense</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span>Wave <b id="w">1</b></span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x;
let cities = [], mis = [], shots = [], booms = [], score = 0, wave = 1, run = false, left = 0, spawnT = 0, ammo = 0, between = 0;
G.set('b', G.best('missile'));
const GY = () => K.H - 60, BASE = () => ({ x: K.W / 2, y: GY() - 10 });
function start() { cities = [.12, .27, .38, .62, .73, .88].map(f => ({ x: K.W * f, alive: 1 })); score = 0; wave = 1; run = true; G.set('s', 0); startWave() }
function startWave() { mis = []; shots = []; left = 8 + wave * 3; spawnT = 1; ammo = left + 8; between = 0; G.set('w', wave) }
addEventListener('pointerdown', e => {
  if (!run || ammo <= 0 || e.clientY > GY() - 20) return; ammo--;
  const b = BASE(), d = Math.hypot(e.clientX - b.x, e.clientY - b.y); shots.push({ x: b.x, y: b.y, tx: e.clientX, ty: e.clientY, sp: 900, d, t: 0 }); G.beep(700, .04, 'square', .04);
});
G.loop(dt => {
  if (run) {
    if (between > 0) { between -= dt; if (between <= 0) { wave++; startWave() } }
    else {
      spawnT -= dt;
      if (spawnT <= 0 && left > 0) {
        left--; spawnT = Math.max(.35, 1.4 - wave * .1) * (.6 + Math.random() * .8);
        const targets = cities.filter(c => c.alive); const tg = targets.length ? targets[Math.random() * targets.length | 0] : { x: K.W / 2 };
        const sx = Math.random() * K.W; mis.push({ sx, sy: 40, x: sx, y: 40, tx: tg.x + (Math.random() - .5) * 20, ty: GY(), sp: 35 + wave * 8 + Math.random() * 20, split: wave > 2 && Math.random() < .2 });
      }
      for (const s of shots) { s.t += dt * s.sp; const p = Math.min(1, s.t / s.d), b = BASE(); s.x = b.x + (s.tx - b.x) * p; s.y = b.y + (s.ty - b.y) * p; if (p >= 1) { s.dead = 1; booms.push({ x: s.tx, y: s.ty, r: 0, t: 0 }); G.beep(150, .2, 'sawtooth', .08) } }
      shots = shots.filter(s => !s.dead);
      const born = [];
      for (const m of mis) {
        const d = Math.hypot(m.tx - m.sx, m.ty - m.sy); m.x += (m.tx - m.sx) / d * m.sp * dt; m.y += (m.ty - m.sy) / d * m.sp * dt;
        if (m.split && m.y > K.H * .35) { m.split = false; for (let k = 0; k < 2; k++) { const tg = cities.filter(c => c.alive)[Math.random() * 6 | 0] || { x: Math.random() * K.W }; born.push({ sx: m.x, sy: m.y, x: m.x, y: m.y, tx: tg.x, ty: GY(), sp: m.sp, split: false }) } }
        for (const b of booms) if (Math.hypot(m.x - b.x, m.y - b.y) < b.r) { m.dead = 1; score += 25; G.set('s', score); booms.push({ x: m.x, y: m.y, r: 0, t: .3 }) }
        if (!m.dead && m.y >= GY()) { m.dead = 1; booms.push({ x: m.x, y: GY(), r: 0, t: .2, enemy: 1 }); G.beep(80, .4, 'sawtooth', .15); cities.forEach(c => { if (c.alive && Math.abs(c.x - m.x) < 30) c.alive = 0 }) }
      }
      mis = mis.filter(m => !m.dead).concat(born);
      if (!cities.some(c => c.alive)) { run = false; G.set('b', G.best('missile', score)); setTimeout(() => G.overlay('The cities fell', 'Score: ' + score + ' · Wave ' + wave, 'Play again', start), 800) }
      else if (left <= 0 && !mis.length && !between) { const bonus = cities.filter(c => c.alive).length * 50 + ammo * 5; score += bonus; G.set('s', score); between = 2; G.beep(900, .3, 'triangle') }
    }
  }
  for (const b of booms) { b.t += dt; b.r = Math.sin(Math.min(1, b.t / .9) * Math.PI) * 48 } booms = booms.filter(b => b.t < .9);
  x.fillStyle = '#05030f'; x.fillRect(0, 0, K.W, K.H);
  x.fillStyle = '#3a1d0a'; x.fillRect(0, GY(), K.W, K.H);
  for (const c of cities) { if (c.alive) { x.fillStyle = '#3df5ff'; x.shadowColor = '#3df5ff'; x.shadowBlur = 8; x.fillRect(c.x - 18, GY() - 14, 10, 14); x.fillRect(c.x - 6, GY() - 22, 10, 22); x.fillRect(c.x + 6, GY() - 10, 12, 10); x.shadowBlur = 0 } else { x.fillStyle = '#3a2a3a'; x.fillRect(c.x - 18, GY() - 4, 36, 4) } }
  const b = BASE(); x.fillStyle = '#4dff88'; x.beginPath(); x.moveTo(b.x - 24, GY()); x.lineTo(b.x, GY() - 26); x.lineTo(b.x + 24, GY()); x.fill();
  x.lineWidth = 1.5; for (const m of mis) { x.strokeStyle = 'rgba(255,77,109,.7)'; x.beginPath(); x.moveTo(m.sx, m.sy); x.lineTo(m.x, m.y); x.stroke(); x.fillStyle = '#fff'; x.fillRect(m.x - 2, m.y - 2, 4, 4) }
  for (const s of shots) { x.strokeStyle = 'rgba(77,255,136,.7)'; x.beginPath(); x.moveTo(BASE().x, BASE().y); x.lineTo(s.x, s.y); x.stroke(); x.strokeStyle = '#fff'; x.beginPath(); x.moveTo(s.tx - 5, s.ty - 5); x.lineTo(s.tx + 5, s.ty + 5); x.moveTo(s.tx + 5, s.ty - 5); x.lineTo(s.tx - 5, s.ty + 5); x.stroke() }
  for (const bm of booms) { const g = x.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, Math.max(1, bm.r)); g.addColorStop(0, '#fff'); g.addColorStop(.4, bm.enemy ? '#ff4d6d' : '#ffe35a'); g.addColorStop(1, 'rgba(255,61,240,0)'); x.fillStyle = g; x.beginPath(); x.arc(bm.x, bm.y, Math.max(1, bm.r), 0, 7); x.fill() }
  if (run) { x.fillStyle = '#cfe8ff'; x.font = '700 13px system-ui'; x.textAlign = 'center'; x.fillText('Ammo: ' + ammo, K.W / 2, GY() + 30) }
  if (between > 0) { x.fillStyle = '#ffe35a'; x.font = '900 26px system-ui'; x.textAlign = 'center'; x.fillText('Wave ' + wave + ' cleared!', K.W / 2, K.H * .4) }
});
G.overlay('Missile Defense', 'Missiles are falling on your cities!<br>Tap the sky to fire a blast there. Missiles caught in a blast are destroyed.<br>Aim a little ahead of them. Ammo is limited.', 'Start', start);
</script></body></html>
