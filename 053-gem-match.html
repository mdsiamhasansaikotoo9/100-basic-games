<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gem Match</title><script>
// Shared helpers for every arcade game
const G = (() => {
  const st = document.createElement('style');
  st.textContent = `
html,body{margin:0;height:100%;background:#0b0820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-weight:700;
  letter-spacing:1px;z-index:5;pointer-events:none;color:#cfe8ff}
.hud b{color:#fff;font-size:20px;text-shadow:0 0 10px #3df5ff}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,5,25,.85);z-index:10;text-align:center;padding:20px}
.ov h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px);background:linear-gradient(90deg,#3df5ff,#ff3df0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{opacity:.88;line-height:1.6;max-width:340px;margin:6px 0}
.ov button{margin-top:18px;font:inherit;font-weight:800;font-size:18px;padding:13px 34px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#3df5ff,#ff3df0);color:#0b0820;cursor:pointer}
`;
  document.head.appendChild(st);

  let ac;
  function beep(f, d = .08, type = 'sine', v = .1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function getBest(k) { try { return +localStorage.getItem('arc_' + k) || 0 } catch (e) { return 0 } }
  function setBest(k, v) { try { localStorage.setItem('arc_' + k, v) } catch (e) {} }
  // Save if higher (or lower when lowerIsBetter). Returns current best.
  function best(k, v, lowerIsBetter) {
    const b = getBest(k);
    if (v != null && (!b || (lowerIsBetter ? v < b : v > b))) { setBest(k, v); return v }
    return b;
  }
  function set(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }

  function overlay(title, html, btn, cb) {
    let o = document.querySelector('.ov');
    if (!o) { o = document.createElement('div'); o.className = 'ov'; document.body.appendChild(o) }
    o.innerHTML = `<h1>${title}</h1><p>${html}</p><button>${btn}</button>`;
    o.style.display = 'flex';
    o.addEventListener('pointerdown', e => e.stopPropagation());
    o.querySelector('button').onclick = e => { e.stopPropagation(); o.style.display = 'none'; beep(440, .08, 'triangle'); cb() };
  }

  // Swipe (touch/mouse) + arrow keys / WASD → 'L','R','U','D'
  function swipe(cb) {
    let sx = null, sy = null;
    addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
    addEventListener('pointerup', e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    });
    addEventListener('keydown', e => {
      const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); cb(m) }
    });
  }

  // Full-screen crisp canvas. Returns {c, x, W, H}; set .onresize to react.
  function canvas() {
    const c = document.createElement('canvas');
    c.style.cssText = 'display:block;width:100vw;height:100vh';
    document.body.prepend(c);
    const o = { c, x: c.getContext('2d'), W: 0, H: 0 };
    function r() {
      const d = Math.min(devicePixelRatio || 1, 2);
      o.W = innerWidth; o.H = innerHeight; c.width = o.W * d; c.height = o.H * d;
      o.x.setTransform(d, 0, 0, d, 0, 0); o.onresize && o.onresize();
    }
    addEventListener('resize', r); r();
    return o;
  }

  // Game loop with delta time (seconds, capped)
  function loop(fn) {
    let last = performance.now();
    function f(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; fn(dt); requestAnimationFrame(f) }
    requestAnimationFrame(f);
  }

  return { beep, getBest, setBest, best, set, overlay, swipe, canvas, loop };
})();

</script></head><body>
<div class="hud"><span>Score <b id="s">0</b></span><span>Moves <b id="m">25</b></span><span>Best <b id="b">0</b></span></div>
<script>
const K = G.canvas(), x = K.x, N = 8, GEMS = ['💎', '🔶', '🟢', '🟣', '⭐', '❤️'];
let B, sel = null, cell, ox, oy, moves = 25, score = 0, run = false, busy = false, pops = [], combo = 0;
G.set('b', G.best('gems'));
K.onresize = () => { cell = Math.floor(Math.min(K.W - 16, K.H - 140) / N); ox = (K.W - cell * N) / 2; oy = (K.H - cell * N) / 2 + 10 }; K.onresize();
const rnd = () => Math.random() * GEMS.length | 0;
function matches() {
  const m = new Set();
  for (let r = 0; r < N; r++) for (let c = 0; c < N - 2; c++) { const t = B[r][c].t; if (t >= 0 && B[r][c + 1].t === t && B[r][c + 2].t === t) [0, 1, 2].forEach(k => m.add(r * N + c + k)) }
  for (let c = 0; c < N; c++) for (let r = 0; r < N - 2; r++) { const t = B[r][c].t; if (t >= 0 && B[r + 1][c].t === t && B[r + 2][c].t === t) [0, 1, 2].forEach(k => m.add((r + k) * N + c)) }
  return m;
}
function start() {
  do { B = [...Array(N)].map((_, r) => [...Array(N)].map(() => ({ t: rnd(), y: r }))) } while (matches().size);
  moves = 25; score = 0; combo = 0; sel = null; busy = false; run = true; G.set('s', 0); G.set('m', 25);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function resolve() {
  combo = 0;
  while (true) {
    const m = matches(); if (!m.size) break; combo++;
    m.forEach(i => { const r = i / N | 0, c = i % N; pops.push({ x: ox + (c + .5) * cell, y: oy + (r + .5) * cell, t: B[r][c].t, life: 1 }); B[r][c].t = -1 });
    score += m.size * 10 * combo; G.set('s', score); G.beep(500 + combo * 120, .1, 'triangle');
    await wait(200);
    for (let c = 0; c < N; c++) {
      const col = []; for (let r = N - 1; r >= 0; r--) if (B[r][c].t >= 0) col.push(B[r][c]);
      let k = 0; const miss = N - col.length; for (let r = N - 1; r >= 0; r--) { if (k < col.length) B[r][c] = col[k++]; else B[r][c] = { t: rnd(), y: r - miss } }
    }
    await wait(330);
  }
}
async function trySwap(a, b) {
  busy = true; const [r1, c1] = a, [r2, c2] = b; [B[r1][c1], B[r2][c2]] = [B[r2][c2], B[r1][c1]]; G.beep(400, .04, 'square', .04);
  await wait(160);
  if (!matches().size) { [B[r1][c1], B[r2][c2]] = [B[r2][c2], B[r1][c1]]; G.beep(150, .1, 'sawtooth'); await wait(160); busy = false; return }
  moves--; G.set('m', moves); await resolve(); busy = false;
  if (moves <= 0) { run = false; G.set('b', G.best('gems', score)); G.overlay('Out of moves', 'Score: ' + score, 'Play again', start) }
}
let down = null;
const cellAt = (px, py) => { const c = Math.floor((px - ox) / cell), r = Math.floor((py - oy) / cell); return r >= 0 && c >= 0 && r < N && c < N ? [r, c] : null };
addEventListener('pointerdown', e => { if (!run || busy) return; down = { p: cellAt(e.clientX, e.clientY), x: e.clientX, y: e.clientY } });
addEventListener('pointerup', e => {
  if (!down || !down.p || busy) { down = null; return }
  const dx = e.clientX - down.x, dy = e.clientY - down.y, p = down.p; down = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) { const q = Math.abs(dx) > Math.abs(dy) ? [p[0], p[1] + Math.sign(dx)] : [p[0] + Math.sign(dy), p[1]]; if (q[0] >= 0 && q[1] >= 0 && q[0] < N && q[1] < N) { sel = null; trySwap(p, q) } return }
  if (sel && Math.abs(sel[0] - p[0]) + Math.abs(sel[1] - p[1]) === 1) { const s = sel; sel = null; trySwap(s, p) } else sel = (sel && sel[0] === p[0] && sel[1] === p[1]) ? null : p;
});
G.loop(dt => {
  for (const p of pops) p.life -= dt * 3; pops = pops.filter(p => p.life > 0);
  x.fillStyle = '#0b0820'; x.fillRect(0, 0, K.W, K.H); if (!B) return;
  x.fillStyle = '#130d2c'; x.fillRect(ox, oy, cell * N, cell * N);
  x.font = `${cell * .7}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = B[r][c]; g.y += (r - g.y) * Math.min(1, dt * 14);
    if ((r + c) % 2) { x.fillStyle = 'rgba(255,255,255,.03)'; x.fillRect(ox + c * cell, oy + r * cell, cell, cell) }
    if (sel && sel[0] === r && sel[1] === c) { x.strokeStyle = '#ffe35a'; x.lineWidth = 3; x.strokeRect(ox + c * cell + 2, oy + r * cell + 2, cell - 4, cell - 4) }
    if (g.t >= 0 && g.y > -1) { x.fillStyle = '#fff'; x.save(); x.beginPath(); x.rect(ox, oy, cell * N, cell * N); x.clip(); x.fillText(GEMS[g.t], ox + (c + .5) * cell, oy + (g.y + .55) * cell); x.restore() }
  }
  x.fillStyle = '#fff'; for (const p of pops) { x.globalAlpha = p.life; x.save(); x.translate(p.x, p.y); x.scale(1 + (1 - p.life), 1 + (1 - p.life)); x.fillText(GEMS[p.t], 0, 0); x.restore() } x.globalAlpha = 1;
  if (combo > 1 && busy) { x.fillStyle = '#ffe35a'; x.font = '900 26px system-ui'; x.fillText('COMBO x' + combo, K.W / 2, oy - 18) }
});
G.overlay('Gem Match', 'Swipe a gem (or tap two side-by-side gems) to swap them.<br>Line up 3 or more of the same to clear them.<br>Chain reactions score extra. You have 25 moves.', 'Start', start);
</script></body></html>
